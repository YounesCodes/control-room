name: macOS

on:
  # Required checks must report on documentation-only pull requests.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      software: ${{ steps.classify.outputs.software }}
      macos_bundle: ${{ steps.classify.outputs.macos_bundle }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/software-changes.mjs --check

  # The required check names belong to the summary jobs below. Each part runs
  # in parallel so the slower Intel runner no longer adds the parts together.
  native-parts-arm64:
    name: Native ${{ matrix.part }} (arm64)
    needs: changes
    if: &run-macos ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.software != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        part: [rust, webkit, e2e]
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPECTED_ARCH: arm64
    steps: &native-steps
      - uses: actions/checkout@v7
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.part != 'webkit'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
        if: matrix.part != 'webkit'
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.part }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: npm ci
      - if: matrix.part == 'rust'
        run: npm run check:version
      - if: matrix.part == 'rust'
        run: npm run check:rust
      - if: matrix.part == 'rust'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features desktop-e2e --lib e2e::tests
      - if: matrix.part == 'webkit'
        run: npx playwright install webkit
      - name: Check the UI in WebKit
        if: matrix.part == 'webkit'
        env:
          CONTROL_ROOM_TEST_BROWSER: webkit
        # Hosted Mac runners stall at random; retry a failed test once here only.
        run: npm run test:browser -- --retry 1
      - if: matrix.part == 'e2e'
        run: npm run test:desktop:build
      - name: Run desktop E2E
        if: matrix.part == 'e2e'
        env:
          CONTROL_ROOM_E2E_SPEC_RETRIES: "1"
        run: npm run test:desktop
      - name: Sanitize failure diagnostics
        id: sanitize
        if: failure() && matrix.part == 'e2e'
        run: node scripts/sanitize-e2e-results.mjs
      - uses: actions/upload-artifact@v7
        if: failure() && steps.sanitize.outcome == 'success'
        with:
          name: macos-${{ env.EXPECTED_ARCH }}-diagnostics
          path: test-results/desktop-sanitized/
          if-no-files-found: ignore

  native-parts-x86-64:
    name: Native ${{ matrix.part }} (x86_64)
    needs: changes
    if: *run-macos
    strategy:
      fail-fast: false
      matrix:
        part: [rust, webkit, e2e]
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      EXPECTED_ARCH: x86_64
    steps: *native-steps

  native-arm64:
    name: Native tests (arm64)
    needs: [changes, native-parts-arm64]
    if: *run-macos
    runs-on: ubuntu-latest
    steps:
      - name: Require every arm64 part
        run: test "${{ needs.native-parts-arm64.result }}" = success

  native-x86-64:
    name: Native tests (x86_64)
    needs: [changes, native-parts-x86-64]
    if: *run-macos
    runs-on: ubuntu-latest
    steps:
      - name: Require every x86_64 part
        run: test "${{ needs.native-parts-x86-64.result }}" = success

  bundle:
    name: App and DMG (${{ matrix.target }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.macos_bundle != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Build ad-hoc signed test bundles
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TARGET: ${{ matrix.target }}
        # Hosted runners sometimes keep the scratch disk image busy while
        # bundle_dmg.sh ejects it. Retry only that failure; the compiled app
        # is reused, so a second attempt only rebuilds the bundles.
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/tauri-build.log"
          for attempt in 1 2 3; do
            if npm run tauri build -- --target "$TARGET" 2>&1 | tee "$log"; then exit 0; fi
            if [[ $attempt == 3 ]] || ! grep -Fq 'Resource busy' "$log"; then exit 1; fi
            echo "DMG disk image was busy; retrying (attempt $attempt of 2)" >&2
            sleep 15
          done
      - name: Verify and archive the application
        env:
          TARGET: ${{ matrix.target }}
        run: |
          root="src-tauri/target/$TARGET/release/bundle"
          codesign --verify --deep --strict "$root/macos/Control Room.app"
          tar -czf "Control-Room-$TARGET.app.tar.gz" -C "$root/macos" 'Control Room.app'
          cp "$root"/dmg/*.dmg .
          shasum -a 256 ./*.dmg ./*.app.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: control-room-${{ matrix.target }}
          path: |
            *.app.tar.gz
            *.dmg
            SHA256SUMS.txt
          if-no-files-found: error
