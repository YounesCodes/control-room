name: Test coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: error

  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --locked --manifest-path src-tauri/Cargo.toml --html
      - run: cargo llvm-cov report --manifest-path src-tauri/Cargo.toml --lcov --output-path src-tauri/target/llvm-cov/lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: |
            src-tauri/target/llvm-cov/html/
            src-tauri/target/llvm-cov/lcov.info
          if-no-files-found: error
