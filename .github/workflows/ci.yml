name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only the latest run per branch/PR needs to finish. Superseded runs are
# cancelled to save CI minutes and give faster feedback — except on main, where
# every merge is validated to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install cargo-audit from a prebuilt release
        uses: taiki-e/install-action@v2.87.2
        with:
          tool: cargo-audit
          fallback: none
      - run: npm ci
      - run: npm run check
      - name: Check Rust dependencies for known security issues
        shell: pwsh
        run: cargo audit --file src-tauri/Cargo.lock

  installer:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build
      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: control-room-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
