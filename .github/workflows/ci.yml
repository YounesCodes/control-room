name: CI

# Skip CI for changes that can't affect the build or tests (docs and repo
# metadata). A push/PR that also touches anything else still runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"

permissions:
  contents: read

# Only the latest run per branch/PR needs to finish. Superseded runs are
# cancelled to save CI minutes and give faster feedback, except on main, where
# every merge is validated to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm run check:frontend

  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust compiler outputs for validation
        uses: Mozilla-Actions/sccache-action@v0.0.11
      - name: Cache Rust dependencies for validation
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
      - name: Install cargo-audit from a prebuilt release
        uses: taiki-e/install-action@v2.87.3
        with:
          tool: cargo-audit
          fallback: none
      - run: npm run check:rust
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
      - name: Check Rust dependencies for known security issues
        shell: pwsh
        run: cargo audit --file src-tauri/Cargo.lock

  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust compiler outputs for installer builds
        uses: Mozilla-Actions/sccache-action@v0.0.11
      - name: Cache Rust dependencies for installer builds
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
      - run: npm ci
      - run: npm run tauri build
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: control-room-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
