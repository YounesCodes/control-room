name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm run check:frontend

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify Apple silicon runner
        if: matrix.os == 'macos-15'
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Cache Rust compiler outputs
        uses: Mozilla-Actions/sccache-action@v0.0.11
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
      - name: Install cargo-audit from a prebuilt release
        if: matrix.os == 'windows-latest'
        uses: taiki-e/install-action@v2.87.4
        with:
          tool: cargo-audit
          fallback: none
      - name: Check Rust dependencies for known security issues
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: cargo audit --file src-tauri/Cargo.lock

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: ""
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify Apple silicon runner
        if: matrix.os == 'macos-15'
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Cache Rust compiler outputs
        uses: Mozilla-Actions/sccache-action@v0.0.11
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
      - run: npm ci
      - name: Build Windows NSIS bundle
        if: matrix.os == 'windows-latest'
        run: npm run tauri build
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
      - name: Build macOS app and DMG bundles
        if: matrix.os == 'macos-15'
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: "-"
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
      - name: Create Windows installer checksum
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
      - name: Create macOS DMG checksum
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
      - name: Upload Windows bundle
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: control-room-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
      - name: Upload macOS bundles
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v7
        with:
          name: control-room-macos-aarch64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.sha256
          if-no-files-found: error
