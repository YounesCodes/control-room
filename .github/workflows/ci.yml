name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only the latest run per branch/PR needs to finish. Superseded runs are
# cancelled to save CI minutes and give faster feedback, except on main, where
# every merge is validated to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      software: ${{ steps.classify.outputs.software }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node --test .github/scripts/software-changes.node.mjs
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/software-changes.mjs --check

  desktop:
    if: ${{ !cancelled() }}
    needs: changes
    uses: ./.github/workflows/desktop-e2e.yml
    with:
      run-tests: ${{ needs.changes.result != 'success' || needs.changes.outputs.software == 'true' }}

  hosted-ssh:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.software == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build and SSH dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: l
        run: |
          # The Azure mirror can remain responsive while downloading too slowly
          # for APT to fail over. Keep the runner's official Ubuntu HTTPS mirrors.
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          grep -q '^https://archive.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
          sudo --preserve-env=DEBIAN_FRONTEND,NEEDRESTART_MODE apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo --preserve-env=DEBIAN_FRONTEND,NEEDRESTART_MODE apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf openssh-server
          node scripts/extract-png-icon.mjs src-tauri/icons/icon.ico src-tauri/icons/icon.png
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
      - name: Run live SSH tests against this disposable runner
        run: bash scripts/test-hosted-ssh.sh

  frontend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.software == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm run check:frontend
      - name: Check Windows shell and Docker command fixtures
        shell: powershell
        run: |
          & ./scripts/test-windows-ssh-probe.ps1
          & ./scripts/test-windows-docker.ps1
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ms-playwright
          # The Chromium build rides the pinned playwright version in the lock.
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - run: npm run test:browser

  validate:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.software == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust compiler outputs for validation
        uses: Mozilla-Actions/sccache-action@v0.0.11
      - name: Cache Rust dependencies for validation
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
      - name: Install cargo-audit from a prebuilt release
        uses: taiki-e/install-action@v2.87.32
        with:
          tool: cargo-audit
          fallback: none
      - run: npm run check:rust
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
      - name: Check Rust dependencies for known security issues
        shell: pwsh
        run: cargo audit --file src-tauri/Cargo.lock

  installer:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.software == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust compiler outputs for installer builds
        uses: Mozilla-Actions/sccache-action@v0.0.11
      - name: Cache Rust dependencies for installer builds
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
          # Shared with the release workflow's build, so a tag restores the
          # release-profile dependencies this job compiled on main instead of
          # building them again from scratch.
          shared-key: "tauri-release-build"
      - run: npm ci
      - run: npm run tauri build
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: control-room-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
