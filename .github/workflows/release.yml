name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  windows:
    outputs:
      release-id: ${{ steps.release-notes.outputs.id }}
    runs-on: windows-latest
    # Warm-cache releases take about five minutes. The timeout leaves room for
    # a release whose Rust caches miss and compiles everything from scratch.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify the tagged commit passed main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-ci.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit from a prebuilt release
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-audit
          fallback: none

      - name: Verify the authored GitHub draft release
        id: release-notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/generate-release-notes.mjs

      # Before the long build, not after it. A release that reaches the end and
      # then cannot be signed has wasted forty minutes, and a release published
      # without updater artifacts is worse: every installed copy would keep
      # asking an endpoint that has nothing valid to serve.
      - name: Verify updater signing is provisioned
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $problems = @()
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            $problems += "The TAURI_SIGNING_PRIVATE_KEY repository secret is not set. Generate a key pair with 'npm run tauri signer generate -- -w .tauri/control-room.key' and store the private key as that secret."
          }
          $pubkey = (Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).plugins.updater.pubkey
          if (-not $pubkey) {
            $problems += "plugins.updater.pubkey is empty in src-tauri/tauri.conf.json. Commit the generated public key there so installed copies can verify what they download."
          }
          if ($problems.Count -gt 0) {
            Write-Host "::error::Updater signing is not provisioned, so this release would be unusable by the in-app updater."
            $problems | ForEach-Object { Write-Host "::error::$_" }
            throw "Updater signing is not provisioned"
          }

      - run: npm ci
      # The tagged commit already passed the full frontend and Rust suites on
      # main through CI, so re-running them here only re-tests the source, not
      # the artifact. What a release itself needs is that its manifests agree
      # with the tag being published — check:version is what keeps package.json,
      # Cargo.toml, and tauri.conf.json from disagreeing with it.
      - run: npm run check:version
      - name: Check Rust dependencies for known security issues
        shell: pwsh
        run: cargo audit --file src-tauri/Cargo.lock

      # The Rust caches share their key with CI's installer job, which compiles
      # the same release profile on main. A tag points at a commit main CI has
      # already built, so the dependency graph is restored instead of compiled,
      # and only the app crate, link, NSIS bundling, and signing remain.
      - name: Cache Rust compiler outputs for the release build
        uses: Mozilla-Actions/sccache-action@v0.0.11
      - name: Cache Rust dependencies for the release build
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
          shared-key: "tauri-release-build"

      # tauri-action builds, signs, and uploads to the authored GitHub draft.
      # It uploads the installer and latest.json, which carries the updater
      # signature inline, so no separate .sig asset is published. Writing
      # that JSON by hand would mean reimplementing the updater's own protocol
      # and keeping it correct across plugin versions.
      #
      # createUpdaterArtifacts lives in a release-only config overlay rather
      # than the main config, so an ordinary `npm run tauri build` on a
      # developer machine never needs the signing key.
      - name: Build and sign a draft release
        uses: tauri-apps/tauri-action@v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        with:
          releaseId: ${{ steps.release-notes.outputs.id }}
          # Keep the body authored on GitHub intact.
          generateReleaseNotes: false
          # Only NSIS is built, so this is the bundle the updater feed must name.
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: false
          args: --config src-tauri/tauri.release.conf.json

      # The publish job checks the signature inside latest.json too. This
      # catches a wrong signing key before Linux and macOS spend their builds.
      - name: Verify the Windows installer signature
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $signature = Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe.sig" | Select-Object -First 1
          if (-not $signature) { throw "No .sig was produced: the updater could not verify this build" }
          $installer = $signature.FullName.Substring(0, $signature.FullName.Length - 4)
          node scripts/verify-updater-signature.mjs $installer $signature.FullName
          if ($LASTEXITCODE -ne 0) { throw "The installer signature or its signed version was rejected" }

  linux:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
          shared-key: tauri-linux-build
      - run: npm ci

      # Run after Windows so the action merges Linux into the existing feed.
      - name: Attach Linux packages and the signed AppImage update
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.windows.outputs.release-id }}
          generateReleaseNotes: false
          uploadUpdaterSignatures: false
          args: --config src-tauri/tauri.release.conf.json

  macos:
    name: Sign and notarize ${{ matrix.target }}
    # Runs after Linux so each tauri-action merges into the feed the previous one wrote.
    needs: [windows, linux]
    if: vars.MACOS_RELEASES == 'true'
    strategy:
      fail-fast: false
      # Each tauri-action merges latest.json. Serialize the uploads to avoid
      # one architecture overwriting the other's updater entry.
      max-parallel: 1
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Require Developer ID signing and notarization credentials
        run: |
          node --input-type=module <<'NODE'
          const required = ['APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGNING_IDENTITY', 'APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID'];
          const missing = required.filter(key => !process.env[key]?.trim());
          if (missing.length || process.env.APPLE_SIGNING_IDENTITY === '-') {
            throw new Error(`macOS releases require Developer ID signing and notarization. Missing: ${missing.join(', ')}`);
          }
          NODE
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
      - run: npm ci
      - name: Build signed and notarized app, DMG, and updater archive
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.windows.outputs.release-id }}
          generateReleaseNotes: false
          uploadUpdaterSignatures: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
      - name: Verify the signature and notarization
        env:
          TARGET: ${{ matrix.target }}
        run: |
          app="src-tauri/target/$TARGET/release/bundle/macos/Control Room.app"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"

  publish:
    name: Verify all enabled platforms and publish
    needs: [windows, linux, macos]
    if: >-
      always() && needs.windows.result == 'success' && needs.linux.result == 'success' &&
      (needs.macos.result == 'success' || (needs.macos.result == 'skipped' && vars.MACOS_RELEASES != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          INCLUDE_MACOS: ${{ vars.MACOS_RELEASES }}
        run: |
          # Checks the asset list and every signature in latest.json, then
          # writes and re-checks SHA256SUMS.txt.
          node scripts/verify-release-assets.mjs
          node scripts/generate-release-notes.mjs --sync-feed latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir verified-feed
          node scripts/generate-release-notes.mjs --validate-feed verified-feed/latest.json
          cmp latest.json verified-feed/latest.json
          gh release edit "$GITHUB_REF_NAME" --draft=false
