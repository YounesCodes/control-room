name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install cargo-audit from a prebuilt release
        uses: taiki-e/install-action@v2.87.4
        with:
          tool: cargo-audit
          fallback: none
      - name: Verify release signing secrets are present
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          $required = @(
            "TAURI_SIGNING_PRIVATE_KEY",
            "APPLE_CERTIFICATE",
            "APPLE_CERTIFICATE_PASSWORD",
            "APPLE_SIGNING_IDENTITY",
            "APPLE_ID",
            "APPLE_PASSWORD",
            "APPLE_TEAM_ID"
          )
          $missing = $required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          $pubkey = (Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).plugins.updater.pubkey
          if (-not $pubkey) { $missing += "plugins.updater.pubkey" }
          if ($missing) {
            $missing | ForEach-Object { Write-Host "::error::Missing release credential: $_" }
            throw "Release signing is not fully provisioned"
          }
      - run: npm ci
      - run: npm run check
      - name: Check Rust dependencies for known security issues
        shell: pwsh
        run: cargo audit --file src-tauri/Cargo.lock

  macos:
    name: Build macOS Apple Silicon release
    needs: validate
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Verify Apple silicon runner
        shell: bash
        run: test "$(uname -m)" = arm64
      - run: npm ci
      - name: Build, sign, notarize, and attach macOS bundles to a draft release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          args: --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json
      - name: Attach macOS DMG checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          gh release upload "$GITHUB_REF_NAME" "$dmg.sha256" --clobber

  windows:
    name: Build Windows x64 release
    needs: macos
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build, sign, and attach Windows bundles to the draft release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json
      - name: Attach Windows installer checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $checksumPath = "$($installer.FullName).sha256"
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($installer.Name)" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          gh release upload $env:GITHUB_REF_NAME $checksumPath --clobber

  publish:
    name: Verify and publish the complete release
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Add release notes to the updater feed and verify every platform
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = (gh release view $env:GITHUB_REF_NAME --json body | ConvertFrom-Json).body
          if (-not $body) { throw "The release has no body to use as update notes" }

          gh release download $env:GITHUB_REF_NAME --pattern latest.json --dir . --clobber
          $feed = Get-Content -LiteralPath latest.json -Raw | ConvertFrom-Json
          $feed.notes = $body
          $json = $feed | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "latest.json"),
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )
          gh release upload $env:GITHUB_REF_NAME latest.json --clobber

          $assets = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets[].name'
          $required = @(
            @{ Pattern = '-setup\.exe$';          Name = "NSIS installer" },
            @{ Pattern = '-setup\.exe\.sig$';     Name = "Windows updater signature" },
            @{ Pattern = '-setup\.exe\.sha256$';  Name = "Windows checksum" },
            @{ Pattern = '\.dmg$';                 Name = "macOS DMG" },
            @{ Pattern = '\.dmg\.sha256$';        Name = "macOS checksum" },
            @{ Pattern = '\.app\.tar\.gz$';       Name = "macOS updater archive" },
            @{ Pattern = '\.app\.tar\.gz\.sig$'; Name = "macOS updater signature" },
            @{ Pattern = '^latest\.json$';         Name = "updater feed" }
          )
          $missingAssets = $required | Where-Object {
            -not ($assets -match $_.Pattern)
          } | ForEach-Object { $_.Name }
          if ($missingAssets) {
            throw "The draft release is missing: $($missingAssets -join ', ')"
          }

          $expected = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($feed.version -ne $expected) {
            throw "latest.json announces $($feed.version) but this tag is $expected"
          }
          if (-not $feed.notes) {
            throw "latest.json has no release notes"
          }
          $platforms = @($feed.platforms.PSObject.Properties.Name)
          if (-not ($platforms -match '^windows-x86_64')) {
            throw "latest.json has no Windows x64 updater entry"
          }
          if (-not ($platforms -match '^darwin-aarch64')) {
            throw "latest.json has no macOS Apple Silicon updater entry"
          }

          gh release edit $env:GITHUB_REF_NAME --draft=false
          Write-Host "Published $($feed.version) for $($platforms -join ', ')"
