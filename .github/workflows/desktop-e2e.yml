name: Desktop E2E

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Optional desktop spec path; leave empty for the full suite"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
      - run: npm ci
      - run: npm run test:desktop:build
      - name: Check debug automation settings
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features desktop-e2e e2e::tests
      - name: Check desktop driver environment
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          Write-Host "Elevated runner: $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          $runtimeKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          foreach ($key in $runtimeKeys) {
            $runtime = Get-ItemProperty -LiteralPath $key -ErrorAction SilentlyContinue
            if ($runtime.pv) { Write-Host "WebView2 runtime: $($runtime.pv)" }
          }
          Get-Command msedgedriver.exe -All -ErrorAction SilentlyContinue | ForEach-Object {
            & $_.Source --version
          }
      - name: Run desktop tests
        shell: pwsh
        env:
          DESKTOP_SPEC: ${{ inputs.spec }}
        run: |
          $arguments = @('run', 'test:desktop', '--', '--logLevel', 'info')
          if ($env:DESKTOP_SPEC) { $arguments += @('--spec', $env:DESKTOP_SPEC) }
          npm @arguments
      - name: Sanitize failure diagnostics
        id: sanitize
        if: failure()
        run: node scripts/sanitize-e2e-results.mjs
      - uses: actions/upload-artifact@v7
        if: failure() && steps.sanitize.outcome == 'success'
        with:
          name: desktop-failure-diagnostics
          path: test-results/desktop-sanitized/
          if-no-files-found: ignore
