name: Desktop E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
      - run: npm ci
      - run: npm run test:desktop:build
      - run: npm run test:desktop
      - name: Sanitize failure diagnostics
        if: failure()
        run: node scripts/sanitize-e2e-results.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-failure-diagnostics
          path: test-results/desktop/
          if-no-files-found: ignore
