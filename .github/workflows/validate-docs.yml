name: Validate documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
      - ".github/workflows/validate-docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        run: npm ci
      - name: Check documentation
        run: npm run check
      - name: Install browser for documentation UI tests
        run: npx playwright install --with-deps chromium
      - name: Build and test documentation UI
        run: npm run test:ui
      - name: Upload documentation UI failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-ui-failure-${{ github.run_id }}
          path: docs/node_modules/.cache/docs-ui-results
          if-no-files-found: ignore
